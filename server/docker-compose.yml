version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://mkuser:mkpass@db:5432/mkjsdb
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mkuser
      POSTGRES_PASSWORD: mkpass
      POSTGRES_DB: mkjsdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkuser"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: